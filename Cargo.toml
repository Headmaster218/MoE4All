[workspace]
resolver = "2"
members = [
    "crates/infr-core",
    "crates/infr-vulkan",
    "crates/infr-metal",
    "crates/infr-hub",
    "crates/infr-gguf",
    "crates/infr-cpu",
    "crates/infr-chat",
    "crates/infr-engine",
    "crates/infr-embedding",
    "crates/infr-server",
    "crates/infr-llama",
    "crates/infr-cli",
    "crates/infr-gui",
    "crates/infr-prof",
    "crates/infr-prof-rt",
    "crates/infr-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Headmaster218/infr"

[workspace.dependencies]
# internal
infr-core = { path = "crates/infr-core" }
infr-vulkan = { path = "crates/infr-vulkan" }
infr-metal = { path = "crates/infr-metal" }
infr-hub = { path = "crates/infr-hub" }
infr-gguf = { path = "crates/infr-gguf" }
infr-cpu = { path = "crates/infr-cpu" }
infr-chat = { path = "crates/infr-chat" }
infr-engine = { path = "crates/infr-engine" }
infr-embedding = { path = "crates/infr-embedding" }
infr-server = { path = "crates/infr-server" }
infr-prof = { path = "crates/infr-prof" }
infr-prof-rt = { path = "crates/infr-prof-rt" }
# Test-support only — a `[dev-dependencies]` entry in the backends, never a production dep.
infr-testkit = { path = "crates/infr-testkit" }

# shared third-party
thiserror = "2"
anyhow = "1"
half = "2"
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: chat templates `tojson` the request's tool definitions into the prompt — HF
# transformers and llama.cpp-minja both keep the author's key order, so infr must too (BTreeMap
# would alphabetize the JSON the model sees).
serde_json = { version = "1", features = ["preserve_order"] }
# The config-file layer (`infr_core::config::file`). Parsed as a `toml::Value` tree rather than a
# serde-derived struct, because an unknown key must WARN and be skipped (docs/config-plan.md §11
# [DECIDE-5]) and `deny_unknown_fields` can only fail.
toml = "0.8"
memmap2 = "0.9"
rayon = "1"
# SIGINT/SIGTERM via `sigaction` in the CLI (see `infr_core::shutdown`). Already in the lockfile
# under tokio and indicatif/console — a direct dep here costs nothing new.
libc = "0.2"
tokio = { version = "1", features = ["full"] }
# Constant-time equality for the `serve` bearer-token check (`infr_server::authorize`). `str`'s
# `==` bails on the first differing byte, which over a network is a byte-at-a-time timing oracle on
# `INFR_API_KEY`; `subtle::ConstantTimeEq` is the purpose-built primitive (no_std, no deps, and its
# comparisons are written to survive the optimizer). Already in the lockfile under sha2/rustls, so
# a direct dep costs no new compilation unit.
subtle = "2"
axum = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
# `env`: the CLI-presentation knob `INFR_DIFFUSION_VISUAL` is a plain clap flag
# (docs/config-plan.md §6.10) whose env spelling stays supported — as clap's own fallback for the
# flag, so it enters through the FLAG layer instead of a `std::env::var` deep in `cmd_run` (R3).
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_complete_nushell = "4"
clap_mangen = "0.3"
# preserve_order: see serde_json below — template values must keep map key order end-to-end.
# fuel: the chat template is attacker-supplied (it ships inside the DOWNLOADED model's GGUF), so
# `infr_chat::template` bounds every render with `Environment::set_fuel` — without this feature the
# setter does not exist and a template with a nested loop renders forever. See CHAT_TEMPLATE_FUEL.
minijinja = { version = "2", features = ["preserve_order", "fuel"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
# `strftime_now` in HF chat templates (Llama-3.x stamps "Today Date:") — llama.cpp-minja parity.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ash = "0.38"
gpu-allocator = { version = "0.27", features = ["vulkan"] }
metal = "0.33"
objc = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
    "stream",
] }
sha2 = "0.10"
indicatif = "0.17"
dirs = "5"
tokenizers = "0.20"
llguidance = "1"
toktrie_hf_tokenizers = "1"

# `cargo test` builds dev (-O0); the CPU interpreter, GGUF dequant, and f16 conversions at -O0 are
# 10-50x slower, which turns the locally-gated model tests (CI skips them — no GGUFs in its cache)
# into minutes EACH. Optimize just the compute crates in dev; test binaries and the harness stay
# -O0 for fast edit-compile cycles. rustc floats are IEEE at every opt level (no fast-math, no FMA
# contraction), so the bit-exact CPU goldens are unaffected.
[profile.dev.package.infr-cpu]
opt-level = 3
[profile.dev.package.infr-gguf]
opt-level = 3
[profile.dev.package.half]
opt-level = 3

# Line tables (not full debug info) in release so sampling profilers (samply/perf — see
# docs/perf/playbook.md) can attribute samples into inlined kernels. Debug info never affects codegen,
# so release perf and the bit-exact goldens are unchanged; only the binary grows.
[profile.release]
debug = "line-tables-only"
