[package]
name = "infr-rocm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
rocm = []

[dependencies]
infr-core.workspace = true
indicatif.workspace = true
infr-gguf.workspace = true
half.workspace = true
bytemuck.workspace = true
rayon.workspace = true

[dev-dependencies]
infr-cpu.workspace = true
# The shared backend decode-parity harness (`tests/shared_decode_parity.rs`).
infr-testkit.workspace = true

[[example]]
name = "smoke_test"
path = "examples/smoke_test.rs"
required-features = ["rocm"]

# Gated behind the `rocm` feature: this example defines its own HIP FFI (only
# valid with ROCm installed) and must not be built by `--all-targets` on a
# non-ROCm host, where its lints/link would break `cargo clippy`/`cargo test`.
[[example]]
name = "hiprtc_test"
path = "examples/hiprtc_test.rs"
required-features = ["rocm"]

# Gated for the same reason as the others: defines its own HIP FFI and exercises
# the RDNA3 WMMA matrix-core builtins (the Phase-5 de-risking probe).
[[example]]
name = "wmma_probe"
path = "examples/wmma_probe.rs"
required-features = ["rocm"]

# Gated: constructs the ROCm backend (feature-gated `RocmBackend`) to time the int8
# WMMA prefill GEMM in isolation for the Slice-25 tile sweep.
[[example]]
name = "wmma_bench"
path = "examples/wmma_bench.rs"
required-features = ["rocm"]

# Gated: Slice-26 probe. Self-contained HIP + rocBLAS FFI to time a library f16 GEMM
# in isolation vs the hand int8 WMMA kernel. Links `librocblas`.
[[example]]
name = "blas_probe"
path = "examples/blas_probe.rs"
required-features = ["rocm"]

# Gated: Slice-31 probe. Self-contained HIP FFI (incl. graph API) to measure whether
# HIP-graph replay cuts the ~10 µs per-dispatch launch floor vs individual launches.
[[example]]
name = "graph_probe"
path = "examples/graph_probe.rs"
required-features = ["rocm"]

# Gated: F4's isolated int8 decode-GEMV bandwidth probe. It names `RocmBackend`,
# which only EXISTS under this feature — without the gate `cargo test` /
# `cargo clippy --all-targets` on a non-ROCm host (i.e. CI) fails to compile it.
[[example]]
name = "decode_gemv_bw"
path = "examples/decode_gemv_bw.rs"
required-features = ["rocm"]
