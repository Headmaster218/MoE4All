[package]
name = "infr-console"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately depends on NO engine crate: the console talks to a running `infr serve` over HTTP
# only, so it builds and runs on a machine with no GPU, no Vulkan SDK and no model.
[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
clap.workspace = true
getrandom.workspace = true
dirs.workspace = true
sha2.workspace = true
toml.workspace = true
futures-util = "0.3"
# TLS termination for the console surface. `ring` is already the provider the lockfile resolved
# for reqwest's rustls, so no new crypto backend is pulled in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"

[[bin]]
name = "infr-console"
path = "src/main.rs"