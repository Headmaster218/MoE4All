<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INFR Console · 用户端</title>
<style>
  :root { color-scheme: dark; --bg:#0c0f14; --panel:#151a23; --line:#263041; --text:#e6edf3; --muted:#8b98aa; --accent:#58a6ff; --bad:#f85149; --ok:#3fb950; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% 0%,#152033,var(--bg)); color:var(--text); font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .shell { width:min(720px,calc(100vw - 32px)); margin:56px auto; }
  .card { padding:26px; border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 18px 60px #0007; }
  .top { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .brand { font-size:20px; font-weight:700; letter-spacing:.04em; }
  .pill { margin-left:auto; padding:4px 10px; border:1px solid var(--line); border-radius:999px; color:var(--muted); }
  label { display:block; margin:14px 0 6px; color:var(--muted); }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; background:#0d1117; color:var(--text); font:inherit; }
  input:focus { outline:none; border-color:var(--accent); }
  button { padding:10px 14px; border:1px solid var(--line); border-radius:8px; background:var(--accent); color:#04101f; font-weight:700; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); }
  .row { display:flex; gap:10px; align-items:end; margin-top:18px; }
  .err { min-height:20px; color:var(--bad); margin-top:10px; }
  .placeholder { padding:18px; border:1px dashed var(--line); border-radius:12px; color:var(--muted); background:#0d1117; }
  .hidden { display:none; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <div class="shell">
    <div class="top">
      <div class="brand">INFR·用户端</div>
      <span class="pill" id="who">未登录</span>
    </div>

    <form class="card" id="login-form">
      <h2 style="margin-top:0">用户登录</h2>
      <p class="err" id="login-err"></p>
      <label for="username">用户名</label>
      <input id="username" autocomplete="username" autofocus required>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <div class="row">
        <button type="submit">登录</button>
        <a href="/login">管理员端</a>
      </div>
    </form>

    <section class="card hidden" id="placeholder">
      <h2 style="margin-top:0">用户端占位页</h2>
      <p>这里将承载普通用户的聊天/推理入口。</p>
      <div class="placeholder">当前版本只完成独立账号鉴权与入口占位；不会暴露 API Keys、启动参数、日志等管理端能力。</div>
      <div class="row"><button class="ghost" id="logout">退出登录</button></div>
    </section>
  </div>

<script>
const loginForm = document.getElementById("login-form");
const placeholder = document.getElementById("placeholder");
const who = document.getElementById("who");
const err = document.getElementById("login-err");

function showUser(user) {
  loginForm.classList.add("hidden");
  placeholder.classList.remove("hidden");
  who.textContent = user ? `已登录：${user}` : "已登录";
}

async function refresh() {
  try {
    const res = await fetch("/ui/user/me");
    const me = await res.json();
    if (me.authenticated) showUser(me.username);
  } catch { /* stay on login form */ }
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  err.textContent = "";
  try {
    const res = await fetch("/ui/user/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    showUser(body.username);
  } catch (e) {
    err.textContent = e.message;
  }
});

document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/ui/user/logout", { method: "POST" });
  location.reload();
});

refresh();
</script>
</body>
</html>
