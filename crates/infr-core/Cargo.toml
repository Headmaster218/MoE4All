[package]
name = "infr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
infr-prof.workspace = true
infr-prof-rt.workspace = true
thiserror.workspace = true
half.workspace = true
bytemuck.workspace = true
indicatif.workspace = true
toml.workspace = true
# `kernel_cache`'s tripwire needs ONE syscall: `kill(pid, 0)` to ask whether the process that
# seeded a cached kernel binary is still alive (see `kernel_cache.rs`).
libc.workspace = true
tracing.workspace = true
rayon.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
