# Portable Agent defaults. User models, network addresses, and credentials are not bundled.

- id: web
  config:
    searchProvider: brave-search

- id: tool-web
  disabled: true

- id: dsh-mneme-moe4all
  config:
    autoSummarize: true
    distillEngine: v2
    dreamMode: v2
    distillMaxTokens: 32768
    distillReasoningEffort: medium
    entityExtractionEnabled: false
    memoryQualityFilter:
      enabled: false

- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 64
    timeoutMs: 60000

# dsh-remote-web-ui-moe4all.publicBaseUrl is intentionally absent. It is installation-specific.
