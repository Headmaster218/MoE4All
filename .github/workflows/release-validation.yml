name: Release Pipeline Validation

on:
  push:
    branches:
      - perf/expert-mtp-optimization
      - release/1.0.0-maintenance
      - 'hotfix/**'
    paths:
      - '.github/actions/setup-build-cache/**'
      - '.github/workflows/release-*.yml'
      - 'scripts/build-image-codecs.py'
      - 'scripts/install-shaderc-linux.sh'
      - 'scripts/package-windows.ps1'
      - 'scripts/linux_release.py'
      - 'scripts/macos_release.py'
      - 'scripts/release_ci.py'
      - 'scripts/test_release_ci.py'
      - 'scripts/smoke-*'
      - 'scripts/infr-wizard.ps1'
      - 'Start-INFR-Wizard.cmd'
      - 'Start-INFR-Wizard-Linux.sh'
      - 'Start-INFR-Wizard-macOS.sh'
      - 'crates/infr-vision/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata-tests:
    name: Validate release promotion metadata
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts -p 'test_release_ci.py' -v

  windows:
    needs: metadata-tests
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-windows.yml
  linux:
    needs: metadata-tests
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-linux.yml
  macos:
    needs: metadata-tests
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-macos.yml
