name: Release Pipeline Validation

on:
  push:
    branches:
      - perf/expert-mtp-optimization
    paths:
      - '.github/workflows/release-*.yml'
      - 'scripts/build-image-codecs.py'
      - 'scripts/install-shaderc-linux.sh'
      - 'scripts/package-windows.ps1'
      - 'scripts/linux_release.py'
      - 'scripts/smoke-*'
      - 'crates/infr-vision/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-windows.yml
  linux:
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
