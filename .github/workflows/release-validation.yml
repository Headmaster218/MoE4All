name: Release Pipeline Validation

on:
  push:
    branches:
      - perf/expert-mtp-optimization
      - release/1.0.0-maintenance
      - 'hotfix/**'
    paths:
      - '.github/workflows/release-*.yml'
      - 'scripts/build-image-codecs.py'
      - 'scripts/install-shaderc-linux.sh'
      - 'scripts/package-windows.ps1'
      - 'scripts/linux_release.py'
      - 'scripts/macos_release.py'
      - 'scripts/smoke-*'
      - 'scripts/infr-wizard.ps1'
      - 'Start-INFR-Wizard.cmd'
      - 'Start-INFR-Wizard-Linux.sh'
      - 'Start-INFR-Wizard-macOS.sh'
      - 'crates/infr-vision/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-windows.yml
  linux:
    permissions:
      contents: write
    uses: ./.github/workflows/release-linux.yml
  macos:
    permissions:
      contents: write
    uses: ./.github/workflows/release-macos.yml
