name: Windows Release (no codecs)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: windows-release-nocodecs-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RUSTFLAGS: '-C target-cpu=x86-64 -C target-feature=+crt-static'
  VULKAN_SDK_VERSION: '1.4.357.0'

jobs:
  package:
    name: Build MoE4All Windows package without image codecs
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: ./.github/actions/setup-build-cache
        with:
          shared-key: windows-release-x86-64
          cache-on-failure: true

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-windows-x64-${{ env.VULKAN_SDK_VERSION }}
      - name: Install Vulkan shader compiler
        shell: pwsh
        run: .\scripts\install-vulkan-sdk-windows.ps1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build portable MoE4All engine (infr.exe)
        run: cargo build --release --locked -p infr-cli --features tts
      - name: Build standalone console client (infr-console.exe)
        run: cargo build --release --locked -p infr-console
      - name: Show sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Create release archive
        shell: pwsh
        run: .\scripts\package-windows.ps1 -Version '1.3.0' -WithoutImageCodecs
      - name: Smoke-test extracted CMD package
        shell: pwsh
        run: |
          $extractPath = Join-Path $env:RUNNER_TEMP 'infr-package-smoke'
          Expand-Archive -LiteralPath '.\dist\MoE4All-Windows-x86_64-v1.3.0.zip' -DestinationPath $extractPath
          $packageRoot = Join-Path $extractPath 'MoE4All-Windows-x86_64-v1.3.0'
          .\scripts\smoke-windows-package.ps1 -PackageRoot $packageRoot -ExpectedVersion '1.3.0' -SkipInteractiveDeviceChecks

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: MoE4All-Windows-x86_64-v1.3.0-nocodecs
          path: |
            dist/MoE4All-Windows-x86_64-v1.3.0.zip
            dist/MoE4All-Windows-x86_64-v1.3.0.zip.sha256
          if-no-files-found: error
          retention-days: 14
