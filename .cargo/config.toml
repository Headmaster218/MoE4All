# Use the portable release baseline, including for local builds. CPU kernels with
# runtime feature detection retain their function-specific SIMD implementations.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64"]

# Match the Windows release CRT linkage. Other architectures keep target defaults.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
